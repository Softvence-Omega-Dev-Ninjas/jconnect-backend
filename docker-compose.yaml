services:
    app:
        image: softvence/jconnect-backend:latest
        container_name: jconnect-backend
        profiles:
            - prod
        platform: linux/amd64
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "${PORT}:${PORT}"
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: postgres:16-alpine
        container_name: pg-db
        profiles:
            - dev
            - prod
        environment:
            - POSTGRES_USER=jconnect
            - POSTGRES_PASSWORD=jconnect
            - POSTGRES_DB=jconnect_db
            - PGDATA=/var/lib/postgresql/data/pgdata
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
<<<<<<< HEAD
