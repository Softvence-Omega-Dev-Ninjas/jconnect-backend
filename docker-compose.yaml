            interval: 10s
            timeout: 5s
            retries: 5

        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: redis
        ports:
            - "6379:6379"
        profiles:
            - dev
            - prod
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        volumes:
            - redis_data:/var/lib/redis/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 5s
        restart: unless-stopped

    caddy:
        image: caddy:latest
        profiles:
            - prod
        container_name: caddy_server
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp" # HTTP/3 support
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - app
        restart: always

volumes:
    caddy_data:
    caddy_config:
    postgres_data:
        driver: local
    redis_data:
        driver: local

networks:
    default:
