<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Firebase Authentication Test - JConnect</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
                    Cantarell, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .container {
                background: white;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                max-width: 500px;
                width: 100%;
                padding: 40px;
                animation: slideIn 0.5s ease-out;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(-20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .header {
                text-align: center;
                margin-bottom: 30px;
            }

            .header h1 {
                color: #333;
                font-size: 28px;
                margin-bottom: 10px;
            }

            .header p {
                color: #666;
                font-size: 14px;
            }

            .status {
                padding: 15px;
                border-radius: 10px;
                margin-bottom: 20px;
                font-size: 14px;
                display: none;
            }

            .status.success {
                background: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
            }

            .status.error {
                background: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
            }

            .status.info {
                background: #d1ecf1;
                color: #0c5460;
                border: 1px solid #bee5eb;
            }

            .auth-section {
                margin-bottom: 30px;
            }

            .btn {
                width: 100%;
                padding: 15px;
                border: none;
                border-radius: 10px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin-bottom: 15px;
            }

            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            }

            .btn:active {
                transform: translateY(0);
            }

            .btn-google {
                background: #fff;
                color: #333;
                border: 2px solid #ddd;
            }

            .btn-google:hover {
                border-color: #4285f4;
                background: #f8f9fa;
            }

            .btn-apple {
                background: #000;
                color: #fff;
            }

            .btn-apple:hover {
                background: #333;
            }

            .btn-logout {
                background: #dc3545;
                color: white;
            }

            .btn-logout:hover {
                background: #c82333;
            }

            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

            .user-info {
                background: #f8f9fa;
                border-radius: 10px;
                padding: 20px;
                margin-top: 20px;
                display: none;
            }

            .user-info.show {
                display: block;
            }

            .user-info h3 {
                color: #333;
                margin-bottom: 15px;
                font-size: 18px;
            }

            .info-item {
                margin-bottom: 10px;
                font-size: 14px;
            }

            .info-item strong {
                color: #666;
                display: inline-block;
                width: 100px;
            }

            .info-item span {
                color: #333;
            }

            .divider {
                text-align: center;
                margin: 20px 0;
                position: relative;
            }

            .divider::before {
                content: "";
                position: absolute;
                left: 0;
                top: 50%;
                width: 100%;
                height: 1px;
                background: #ddd;
            }

            .divider span {
                background: white;
                padding: 0 15px;
                position: relative;
                color: #999;
                font-size: 14px;
            }

            .loading {
                display: inline-block;
                width: 20px;
                height: 20px;
                border: 3px solid #f3f3f3;
                border-top: 3px solid #667eea;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            .icon {
                width: 20px;
                height: 20px;
            }

            .settings-section {
                background: #f8f9fa;
                border-radius: 10px;
                padding: 20px;
                margin-bottom: 20px;
            }

            .settings-section h3 {
                font-size: 16px;
                color: #333;
                margin-bottom: 15px;
            }

            .input-group {
                margin-bottom: 15px;
            }

            .input-group label {
                display: block;
                margin-bottom: 5px;
                font-size: 14px;
                color: #666;
                font-weight: 500;
            }

            .input-group input {
                width: 100%;
                padding: 10px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 14px;
                transition: border-color 0.3s;
            }

            .input-group input:focus {
                outline: none;
                border-color: #667eea;
            }

            .btn-save {
                background: #667eea;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                cursor: pointer;
                font-weight: 600;
            }

            .btn-save:hover {
                background: #5568d3;
            }

            .response-data {
                background: #f8f9fa;
                border-radius: 10px;
                padding: 15px;
                margin-top: 15px;
                max-height: 300px;
                overflow-y: auto;
            }

            .response-data pre {
                font-size: 12px;
                color: #333;
                white-space: pre-wrap;
                word-wrap: break-word;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>🔥 Firebase Auth Test</h1>
                <p>Test Google & Apple Sign-In with Backend</p>
            </div>

            <div id="statusMessage" class="status"></div>

            <!-- Settings Section -->
            <div class="settings-section">
                <h3>⚙️ Backend Configuration</h3>
                <div class="input-group">
                    <label for="backendUrl">Backend Endpoint URL:</label>
                    <input
                        type="text"
                        id="backendUrl"
                        placeholder="http://localhost:5050/auth/firebase-login"
                        value="http://localhost:5050/auth/firebase-login"
                    />
                </div>
                <button class="btn-save" id="saveBtn">💾 Save Configuration</button>
            </div>

            <!-- Login Buttons -->
            <div id="loginSection" class="auth-section">
                <button id="googleSignInBtn" class="btn btn-google">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        />
                        <path
                            fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        />
                        <path
                            fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        />
                        <path
                            fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        />
                    </svg>
                    Sign in with Google
                </button>

                <button id="appleSignInBtn" class="btn btn-apple">
                    <svg class="icon" fill="white" viewBox="0 0 24 24">
                        <path
                            d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"
                        />
                    </svg>
                    Sign in with Apple
                </button>

                <div class="divider">
                    <span>Test Authentication</span>
                </div>
            </div>

            <!-- Logout Button -->
            <div id="logoutSection" style="display: none">
                <button id="logoutBtn" class="btn btn-logout">Logout</button>
            </div>

            <!-- User Info Display -->
            <div id="userInfo" class="user-info">
                <h3>✅ Logged In Successfully!</h3>
                <div class="info-item">
                    <strong>Email:</strong>
                    <span id="userEmail">-</span>
                </div>
                <div class="info-item">
                    <strong>Name:</strong>
                    <span id="userName">-</span>
                </div>
                <div class="info-item">
                    <strong>User ID:</strong>
                    <span id="userId">-</span>
                </div>
                <div class="info-item">
                    <strong>Username:</strong>
                    <span id="userUsername">-</span>
                </div>
                <div class="info-item">
                    <strong>Provider:</strong>
                    <span id="userProvider">-</span>
                </div>
                <div class="info-item">
                    <strong>JWT Token:</strong>
                    <span id="userToken" style="word-break: break-all; font-size: 11px">-</span>
                </div>

                <div class="response-data">
                    <strong>Backend Response:</strong>
                    <pre id="backendResponse">-</pre>
                </div>
            </div>
        </div>

        <!-- Firebase SDK -->
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import {
                getAuth,
                signInWithPopup,
                GoogleAuthProvider,
                OAuthProvider,
                signOut,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

            // Firebase configuration
            const firebaseConfig = {
                apiKey: "AIzaSyCwlKwAvJJ_e0nLLX84Xqn9h5bQtARsycM",
                authDomain: "jconnect-b6f89.firebaseapp.com",
                projectId: "jconnect-b6f89",
                storageBucket: "jconnect-b6f89.firebasestorage.app",
                messagingSenderId: "117806012294",
                appId: "1:117806012294:web:bb4bcde2c7fd65fed93e07",
                measurementId: "G-81J9NQ13DG",
            };

            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            console.log("✅ Firebase initialized successfully");

            // Backend API URL
            let BACKEND_URL =
                localStorage.getItem("backendUrl") || "http://localhost:5050/auth/firebase-login";
            document.getElementById("backendUrl").value = BACKEND_URL;

            // DOM Elements
            const googleSignInBtn = document.getElementById("googleSignInBtn");
            const appleSignInBtn = document.getElementById("appleSignInBtn");
            const logoutBtn = document.getElementById("logoutBtn");
            const saveBtn = document.getElementById("saveBtn");
            const statusMessage = document.getElementById("statusMessage");
            const userInfo = document.getElementById("userInfo");
            const loginSection = document.getElementById("loginSection");
            const logoutSection = document.getElementById("logoutSection");

            // Save backend URL
            saveBtn.addEventListener("click", function () {
                const input = document.getElementById("backendUrl");
                BACKEND_URL = input.value.trim();
                localStorage.setItem("backendUrl", BACKEND_URL);
                showStatus("✅ Backend URL saved: " + BACKEND_URL, "success");
            });

            // Show status message
            function showStatus(message, type = "info") {
                statusMessage.textContent = message;
                statusMessage.className = `status ${type}`;
                statusMessage.style.display = "block";

                if (type === "success" || type === "error") {
                    setTimeout(() => {
                        statusMessage.style.display = "none";
                    }, 5000);
                }
            }

            // Display user info
            function displayUserInfo(backendResponse) {
                const { user, token } = backendResponse.data;

                document.getElementById("userEmail").textContent = user.email || "-";
                document.getElementById("userName").textContent = user.full_name || "-";
                document.getElementById("userId").textContent = user.id || "-";
                document.getElementById("userUsername").textContent = user.username || "-";
                document.getElementById("userProvider").textContent = user.auth_provider || "-";
                document.getElementById("userToken").textContent = token
                    ? token.substring(0, 50) + "..."
                    : "-";
                document.getElementById("backendResponse").textContent = JSON.stringify(
                    backendResponse,
                    null,
                    2,
                );

                userInfo.classList.add("show");
                loginSection.style.display = "none";
                logoutSection.style.display = "block";
            }

            // Send token to backend
            async function sendTokenToBackend(idToken, provider) {
                try {
                    showStatus("Sending token to backend...", "info");

                    const response = await fetch(BACKEND_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        credentials: "include",
                        body: JSON.stringify({
                            idToken,
                            provider,
                            username: "",
                        }),
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || "Backend authentication failed");
                    }

                    showStatus("✅ Successfully authenticated with backend!", "success");
                    displayUserInfo(data);

                    console.log("Backend Response:", data);
                    return data;
                } catch (error) {
                    console.error("Backend Error:", error);
                    showStatus(`❌ Backend Error: ${error.message}`, "error");
                    throw error;
                }
            }

            // Google Sign-In
            googleSignInBtn.addEventListener("click", async () => {
                try {
                    googleSignInBtn.disabled = true;
                    googleSignInBtn.innerHTML = '<div class="loading"></div> Signing in...';
                    showStatus("Opening Google Sign-In...", "info");

                    const provider = new GoogleAuthProvider();
                    const result = await signInWithPopup(auth, provider);

                    showStatus("Getting Firebase token...", "info");
                    const idToken = await result.user.getIdToken();

                    console.log("Firebase User:", result.user);
                    console.log("ID Token:", idToken);

                    await sendTokenToBackend(idToken, "google");
                } catch (error) {
                    console.error("Google Sign-In Error:", error);
                    showStatus(`❌ Error: ${error.message}`, "error");
                    googleSignInBtn.disabled = false;
                    googleSignInBtn.innerHTML = `
                    <svg class="icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign in with Google
                `;
                }
            });

            // Apple Sign-In
            appleSignInBtn.addEventListener("click", async () => {
                try {
                    appleSignInBtn.disabled = true;
                    appleSignInBtn.innerHTML = '<div class="loading"></div> Signing in...';
                    showStatus("Opening Apple Sign-In...", "info");

                    const provider = new OAuthProvider("apple.com");
                    const result = await signInWithPopup(auth, provider);

                    showStatus("Getting Firebase token...", "info");
                    const idToken = await result.user.getIdToken();

                    console.log("Firebase User:", result.user);
                    console.log("ID Token:", idToken);

                    await sendTokenToBackend(idToken, "apple");
                } catch (error) {
                    console.error("Apple Sign-In Error:", error);
                    showStatus(`❌ Error: ${error.message}`, "error");
                    appleSignInBtn.disabled = false;
                    appleSignInBtn.innerHTML = `
                    <svg class="icon" fill="white" viewBox="0 0 24 24">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    Sign in with Apple
                `;
                }
            });

            // Logout
            logoutBtn.addEventListener("click", async () => {
                try {
                    await signOut(auth);

                    userInfo.classList.remove("show");
                    loginSection.style.display = "block";
                    logoutSection.style.display = "none";

                    showStatus("Logged out successfully", "success");

                    googleSignInBtn.disabled = false;
                    appleSignInBtn.disabled = false;
                    googleSignInBtn.innerHTML = `
                    <svg class="icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign in with Google
                `;
                    appleSignInBtn.innerHTML = `
                    <svg class="icon" fill="white" viewBox="0 0 24 24">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    Sign in with Apple
                `;
                } catch (error) {
                    console.error("Logout Error:", error);
                    showStatus(`❌ Error: ${error.message}`, "error");
                }
            });

            // Initial status
            showStatus("✅ Firebase ready! Click a button to sign in.", "info");
            console.log("Backend URL:", BACKEND_URL);
        </script>
    </body>
</html>
